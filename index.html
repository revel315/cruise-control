<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruise Control</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cruise Control">

  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  

<h1>Cruise Control</h1>
<h3>Fuel Entry</h3>

<form id="fuelForm">

<label>Car</label>
<select id="car">
  <option value="1">Pilot</option>
  <option value="2">Other Car</option>
</select>

<label>Date</label>
<input type="date" id="date">

<label>Mileage</label>
<input type="number" id="mileage">

<label>Gallons</label>
<input type="number" step="0.01" id="gallons">

<label>Price per gallon</label>
<input type="number" step="0.001" id="price">

<label>Car MPG (trip computer)</label>
<input type="number" step="0.1" id="carMPG">

<p id="costPreview">Total Cost: --</p>
<p id="mpgPreview">MPG: --</p>

<button type="submit">Save Fuel Log</button>

<p id="successMessage" style="color:green; display:none;">
Fuel log saved!
</p>

</form>

<script src="js/app.js"></script>

</body>
</html>
