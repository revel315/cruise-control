<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruise Control</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js"></script>I
</head>
<body>
  

<h1>Cruise Control</h1>
<h3>Fuel Entry</h3>

<form id="fuelForm">

<label>Car</label>
<select id="car">
  <option value="1">Pilot</option>
  <option value="2">Other Car</option>
</select>

<label>Date</label>
<input type="date" id="date">

<label>Mileage</label>
<input type="number" id="mileage">

<label>Gallons</label>
<input type="number" step="0.01" id="gallons">

<label>Price per gallon</label>
<input type="number" step="0.001" id="price">

<label>Car MPG (trip computer)</label>
<input type="number" step="0.1" id="carMPG">

<button type="submit">Save Fuel Log</button>

</form>

<script src="js/app.js"></script>

</body>
</html>
